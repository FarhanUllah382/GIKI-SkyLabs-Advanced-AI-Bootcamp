# ---------------------------------------------------------
# Plain LoRA config (base model loaded in bf16/fp16, no quantization)
# ---------------------------------------------------------

model:
  name_or_path: "Qwen/Qwen2.5-1.5B-Instruct"
  torch_dtype: "bfloat16"        # bfloat16 | float16 | float32
  device_map: "auto"

lora:
  r: 16                          # rank of the low-rank matrices — higher = more capacity, more params
  lora_alpha: 32                 # scaling factor. effective scale = lora_alpha / r
  lora_dropout: 0.05
  bias: "none"                   # none | all | lora_only
  task_type: "CAUSAL_LM"
  target_modules:                # which linear layers get LoRA adapters
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

data:
  dataset_name: "tatsu-lab/alpaca"
  train_subset_size: 1000        # keep small for fast iteration
  max_seq_length: 512

training:
  output_dir: "./outputs/lora-run"
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4
  num_train_epochs: 1
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03
  logging_steps: 10
  save_strategy: "epoch"
  bf16: true
  fp16: false
  optim: "adamw_torch"
  report_to: "none"              # set to "wandb" if you want experiment tracking
