# ---------------------------------------------------------
# QLoRA config (base model loaded in 4-bit via bitsandbytes)
# ---------------------------------------------------------

model:
  name_or_path: "Qwen/Qwen2.5-1.5B-Instruct"
  device_map: "auto"

quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4"          # nf4 | fp4  (nf4 is the QLoRA-paper default, better for weights)
  bnb_4bit_compute_dtype: "bfloat16"  # compute dtype used during forward/backward
  bnb_4bit_use_double_quant: true     # quantizes the quantization constants too — saves more memory

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

data:
  dataset_name: "tatsu-lab/alpaca"
  train_subset_size: 1000
  max_seq_length: 512

training:
  output_dir: "./outputs/qlora-run"
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4
  num_train_epochs: 1
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03
  logging_steps: 10
  save_strategy: "epoch"
  bf16: true
  fp16: false
  optim: "paged_adamw_8bit"           # memory-efficient optimizer, standard for QLoRA
  report_to: "none"
